code: hpc-dev
name: "RegCM5 HPC DevOps"
description: "Custom BMAD agents and workflows executing RegCM5's HPC-modernization PRD: code comprehension, HPC Fortran development, profiling, GPU porting, cross-vendor build portability, containerization, and CI."
module_version: 1.0.0
default_selected: false
module_greeting: >
  RegCM5 HPC DevOps is ready. Six agents (Gaspare, Jacopo, Lorenzo, Dario, Franco, Giacomo) and seven workflows
  execute the RegCM5 HPC-modernization PRD (FR-1 through FR-38) and Architecture Spine already
  approved for this project. Start with hpc-dev-agent-code-comprehension (Gaspare) to explore the codebase,
  or hpc-dev-evidence-baseline (Lorenzo) to establish a profiling baseline.

  Run this again at any time to reconfigure, or edit _bmad/config.yaml / config.user.yaml directly.

FAST_BASELINE_ROOT:
  prompt: "Path to the canonical baseline/profiling storage on $FAST?"
  default: "/leonardo_scratch/fast/ICT26_MHPC_0/franco/RegCM-data"
  result: "{value}"

WORK_ARCHIVE_ROOT:
  prompt: "Path to the archive-on-supersession storage on $WORK?"
  default: "/leonardo_work/ICT26_MHPC_0/franco/RegCM-archive"
  result: "{value}"

SLURM_ACCOUNT_DCGP:
  prompt: "Slurm account for Intel/GNU (dcgp_usr_prod) jobs?"
  default: "ICT26_MHPC_0"
  result: "{value}"

SLURM_ACCOUNT_BOOST:
  prompt: "Slurm account for NVHPC (boost_usr_prod) jobs?"
  default: "ICT26_MHPC"
  result: "{value}"

COMPILER_MODULES:
  prompt: "Cluster module names for GNU/Intel/NVHPC (comma-separated)? Confirm against $HPCDOCS before accepting a default."
  default: ""
  result: "{value}"

agents:
  - code: code-comprehension
    name: Gaspare
    title: Code Comprehension Guide
    icon: 🔍
    description: Reads and explains RegCM5 source code and answers developer questions about it; never modifies code.
  - code: hpc-software-developer
    name: Jacopo
    title: HPC Software Developer
    icon: ⚙️
    description: Writes and modifies modern Fortran for RegCM5 on HPC infrastructure, consulting local cluster documentation before environment-specific code.
  - code: profiler
    name: Lorenzo
    title: Profiler
    icon: 📈
    description: Captures reproducible perf/Nsight/FlameGraph profiling evidence for RegCM5 and produces attributable hotspot reports.
  - code: gpu-porting
    name: Dario
    title: GPU Porting Specialist
    icon: 🚀
    description: Decides GPU-port candidacy from evidence, ports via do-concurrent-first-then-OpenACC-escalation, and validates against the two-tier numerical-reproducibility policy.
  - code: build-portability
    name: Franco
    title: Build Portability Engineer
    icon: 🛠️
    description: Keeps the autotools build green across GNU/Intel/NVHPC and implements I/O opt-in namelist switches once a bottleneck is diagnosed.
  - code: ci-container
    name: Giacomo
    title: CI/Container Engineer
    icon: 📦
    description: Packages validated builds into devel/runtime multi-stage NVHPC containers and maintains the GitHub Actions pipeline as a necessary-not-sufficient guardrail.
